<html>
<head>
  <title>Service preview</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="included/bootstrap.min.css">
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"> -->
  <!-- <script src="bootstrap.min.js"></script> -->
  <script src="included/babel.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.2.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, StrictMode } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0';

    export default function Entire() {
      var activeComponent = <EnteringPanel interaction={refreshContent} />;
      const [component, setComponent] = useState(activeComponent);

      function refreshContent(request) {
		var query_data = {"authorization": "Bearer "+userAccessToken};
        if (request == "enter") {
		  activeComponent = <PrivateCabinet interaction={refreshContent} />;
		  ServerCommand({method:"GET", url:"https://restroreserve-api.onrender.com/api/bookings", contentType: "application/json", headers:query_data},function(){setComponent(activeComponent);});
        } 
        else if (request == "reserve") {
		  query_data = {"authorization": "Bearer "+userAccessToken};
          activeComponent = <PrepareOrder interaction={refreshContent} />;
		  ServerCommand({method:"GET", url:"https://restroreserve-api.onrender.com/api/bookings/tables", contentType: "application/json", headers:query_data, data:{date: current.toISOString().split("T")[0],time:current.getHours().toString().padStart(2,0)+':'+current.getMinutes().toString().padStart(2,0)}},function(){setComponent(activeComponent);});
        }
        else {
		  setComponent(activeComponent);
        }
      }

      return (
        <main className="container">
          {component}
        </main>
      );
    }
	
//	sign-related panel via customer data handling, register/authorize state included, opens with application start 
    function EnteringPanel({interaction}) {
      const [altered, setAltered] = useState(false);

      function buttonEffect(argument) {
        interaction(argument);
      }
      function switchPanelState(mode) {
        setAltered(mode);
      }

      return (
        <><div className="row">
          <div className="h4 col">
            Введите данные
          </div>
          <EnteringStateButton effect={switchPanelState} activeState={altered}/>
        </div>
        <form id="entering">
          <p className="form-floating">
          <input 
            name="customer_email"
            type="email" 
            className="form-control"
            required={true} 
            placeholder="Электронная почта" />
          <label htmlFor="customer_email">Электронная почта</label></p>
          <p className="form-floating">
          <input 
            name="customer_code"
            type="password" 
            className="form-control"
            required={true} 
            placeholder="Пароль" />
          <label htmlFor="customer_code">Пароль</label></p>
          <p className="form-floating">
          <input
            name="customer_label" 
            type="text" 
            className="form-control special"
            required={true} 
            placeholder="Псевдоним" />
          <label htmlFor="customer_label">Псевдоним</label></p>
          <p className="form-floating">
          <input 
            name="customer_phone" 
            type="tel" 
            className="form-control special" 
            required={true} 
            placeholder="Телефон" />
          <label htmlFor="customer_phone">Телефон</label></p>
          <h6 id="state_info">Регистрация</h6>
        </form>
		<EnterButton effect={buttonEffect} activeState={altered} />
		<p /><div class="alert" role="alert"></div></>
      );
    }

    function EnterButton({effect, activeState}) {
	var query_data,enterform;
      function handleTap() {
	  enterform = document.forms["entering"];
        if(enterform.checkValidity()) {
          if(activeState) {
			query_data = '{"email":"'+enterform.customer_email.value+'", "password":"'+enterform.customer_code.value+'"}';
			ServerCommand({method: "POST", url: "https://restroreserve-api.onrender.com/api/auth/login", data:query_data, contentType: "application/json", error: function(result){
				enterform.reset(); 
				response = result; 
				displayError(document.getElementsByClassName("alert")[0]);}},
			function(){userAccessToken = response.token; effect("enter"); });
		  } 
          else {
			query_data = '{"email":"'+enterform.customer_email.value+'", "password":"'+enterform.customer_code.value+'", "name":"'+enterform.customer_label.value+'", "phone":"'+enterform.customer_phone.value+'"}';
            ServerCommand({method: "POST", url: "https://restroreserve-api.onrender.com/api/auth/register", data:query_data, contentType: "application/json", error: function(result){
				enterform.reset(); 
				response = result; 
				displayError(document.getElementsByClassName("alert")[0]);}},
			function(){userAccessToken = response.token; effect("reserve"); });
          }
		} 
        else {
          enterform.reportValidity();
        }
      }

      return (
        <button className="btn btn-primary" onClick={handleTap} type="button">Продолжить</button>
      );
    }

    function EnteringStateButton({effect, activeState}) {
      function handleTap(){
		if(!activeState){
        AlterState("Авторизация");
		state_info = "Регистрация";}
		else {
		AlterState("Регистрация");
		state_info = "Авторизация";}
        effect(!activeState);
      }
      return (
        <div className="col text-end switch">
            <button className="btn btn-primary rounded-circle p-1 lh-2" type="button" onClick={handleTap}>
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" 
                height="24" 
                fill="currentColor" 
                className="bi bi-play-fill" 
                viewBox="0 0 16 16" >
              <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
            </svg></button>
          <span> <u>{state_info}</u></span>
        </div>
      );
    }

//	section with current order's details and cancel option, shows after authorization when active order is there		
    function PrivateCabinet({interaction}) {
	  let order_slot_name = "Пусто", 
        order_date = "Дата", 
        order_time = "00:00";
		if (response.booking.length != 0){
			order_slot_name = "слот #"+response.booking[0].table;
			order_date = response.booking[0].date;
			order_time = "("+response.booking[0].time+")";
		}

      function buttonEffect(argument){
        interaction(argument);
      }

      return (
        <div id="private_cabinet">
          <h4>Личный кабинет</h4>
          <ul>
            <li>Назначен: {order_slot_name}</li>
            <li>Время: {order_date} - {order_time}</li>
          </ul>
          <RejectOrderButton effect={buttonEffect}/>
		  <p /><div class="alert" role="alert"></div>
        </div>
      );
    }
	
    function RejectOrderButton({effect}) {
      function handleTap() {
		if(response.booking.length != 0){
		var slot_id = response.booking[0].id;
		ServerCommand({method: "POST", url: "https://restroreserve-api.onrender.com/api/bookings/"+slot_id+"/delete", headers:{"authorization": "Bearer "+userAccessToken}},function(){});
		}
		effect("reserve");
      }

      return (
        <button 
          form="prepare_order" 
          className="btn btn-primary" 
          type="reset" 
          onClick={handleTap}>Освободить</button>
      );
    }

//	list of available to reserve slots, shows after registration
    function PrepareOrder({interaction}) {
      var slots_list = [];
		if (typeof(response) != 'undefined'){
//	!
		var slots_list = response.booking;
		}
		var options = slots_list.map(each_slot => <option value={each_slot.table}>#{each_slot.table} (x{each_slot.seats_count})</option>);
      function buttonEffect(argument){
        interaction(argument);
      }

      return (
        <form id="prepare_order">
          <h4>Каталог выбора</h4>
          <select 
            id="order_options" 
            className="form-select-lg mb-3" 
            onChange={() => ToggleOptions(true)} 
            required={true} >
            <option>Подобрать</option>
            {options}
          </select>
          <dialog id="confirm" className="bg-body-secondary">
          <ConfirmOrderPanel />
          <p></p>
          <div className="row">
            <div className="col">
              <ResetOrderButton />
              <FireOrderButton effect={buttonEffect} />
            </div></div>
          </dialog>
        </form>
      );
    }

//	confirmation panel to define date and time then send order, shows after choosing slot	
    function ConfirmOrderPanel() {
      return (
        <><h4>Назначить бронирование</h4>
          <div className="row">
            <div className="col">
              <input type="date" className="form-control" min={current.toISOString().split("T")[0]} required />
            </div></div>
          <div className="row">
            <div className="col">
              <input 
                type="time" 
                className="form-control" 
                min="12:00" 
                max="22:00" 
                required={true} />
            <p /><div class="alert" role="alert"></div>
			</div></div></>
      );
    }

    function ResetOrderButton() {
      return (
        <button className="btn btn-secondary" type="reset" onClick={() => ToggleOptions(false)}>Отмена</button>
      );
    }
	
    function FireOrderButton({effect}) {
		var query_data,orderform;
      function handleTap() {
		orderform = document.forms["prepare_order"];
        if(orderform.checkValidity()){
		query_data = '{"tableNumber": '+document.getElementById("order_options").value+', "date":"'+orderform[1].value+'", "time":"'+orderform[2].value+'"}';
		  ServerCommand({method: "POST", url: "https://restroreserve-api.onrender.com/api/bookings", data:query_data, contentType: "application/json", headers:{"authorization": "Bearer "+userAccessToken}, error: function(result){ 
			response = result; 
			displayError(document.getElementsByClassName("alert")[0]);}},
		  function(){effect("enter");});
        } 
        else {
          orderform.reportValidity();
        }
      }

      return (
        <button className="btn btn-success" value="new_order" type="button" onClick={handleTap}>Забронировать</button>
      );
    }

    const root = createRoot(document.getElementById('entire'));
    root.render(
      <StrictMode>
          <Entire />
      </StrictMode>
    );
  </script>
  <script>
  let response,userAccessToken,current = new Date();
  let state_info = "Авторизация";
	//	show and hide present order confirmation's dialog
    function ToggleOptions(mode) {
      document.getElementById('order_options').disabled = mode;
      var orderModal = document.getElementById('confirm');
      if (mode) {
        orderModal.showModal();
      } else {
		document.getElementsByClassName("alert")[0].textContent = "";
        orderModal.close();
      }
    }
	//	switch sign-panel state to be used for authorization instead
    function AlterState(new_state) {
      document.getElementById('state_info').innerHTML = new_state;
	  document.getElementsByClassName("alert")[0].className = "alert";
	  document.getElementsByClassName("alert")[0].textContent = "";
      for (var x of document.getElementsByClassName('special')){
        x.disabled = !x.disabled;
        x.required = !x.required;
      }
    }
	
	function ServerCommand(cmd,execute){
	$.ajax(cmd).done(function( result ) {
		response = result;
		execute();
	});
	}
	
	function displayError(indicator){
		var result;
		indicator.className = "alert alert-danger";
		if(typeof(response.responseJSON) != 'undefined'){
		result = response.responseJSON;
		if(typeof(result.error) == 'string'){
			indicator.textContent = result.error;}
		if(typeof(result.errors) == 'object'){
			indicator.textContent = result.errors[0].message;}
		}
		else{
			indicator.textContent = "Неопознанная ошибка!";
		}
	}
  </script>
</head>
<body>
  <p><div id="entire"></div></p>
  <style>
body {
	background: #e9fee0;
	color: #20686c;}
.btn-primary {
	--bs-btn-bg: #5988f0;
	--bs-btn-border-color: auto;}
.form-control {
	color: #196c6c;}
.form-floating>label {
	color: #a2b6d2;}
</style>
</body>
</html>
